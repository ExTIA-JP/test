<style>
* { margin: 0; padding: 0; }
.header {
  position: relative;
  margin: 50px;
  /* background: url("img/cover01.png") no-repeat 50% 50%; */
}
.header h1 {
  position: absolute;
  top: calc(50% - 20px);
  left: 0;
  z-index: 2;
  font-size: 20px;
}

  max-width: 100%;
  height: auto;

<body>

<div class="header">
  <h1>見出し</h1>
  <div class="aiueo"><img src="img/cover01.png" alt=""></div>
</div>

<p class="test -test2"></p>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>


<script src="/common/js/common.js"></script>
<script>
$(function() {

  var $el = $('.test');
  var classActive = 'active';
  var time = 5000;
  var init = function() {
    setTimeout(function() {
      setLoop();
    }, time);
    return this;
  };
  var setLoop = function() {
    setTimeout(setLoop, setTime());
    $el.toggleClass(classActive);

    return this;
  };
  var setTime = function() {
    var num = 3000;
    if($el.hasClass(classActive)) {
      num = Math.floor(Math.random() * 1000);
    }
    console.log(num);
    return num;
  };
  init();



});
</script>
</body>
